name: Content Release Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publishable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate-questions
      - run: pnpm content:verify --publish
